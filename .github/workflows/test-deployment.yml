name: Test Deployment

on:
  workflow_dispatch:

jobs:
  deploy-to-test:
    runs-on: self-hosted

    steps:
      - name: Pull latest Docker image
        run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/calculator-app:latest

      - name: Stop and remove existing container
        run: |
          docker stop calculator-test || true
          docker rm calculator-test || true

      - name: Run latest container
        run: docker run -d --name calculator-test -p 3000:3000 ${{ secrets.DOCKERHUB_USERNAME }}/calculator-app:latest
